name: Build VSIX

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # the build script calls pnpm internally
      - run: corepack enable

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: amaze-browser-vsix
          path: bin/*.vsix
          if-no-files-found: error

      # creates a GitHub release once per version in package.json
      - name: Release
        if: github.ref == 'refs/heads/main'
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          awk -v v="$version" '/^## \[/ { if (found) exit; found = index($0, "[" v "]") } found && !/^## \[/ && !/^\[.*\]: /' CHANGELOG.md > notes.md
          gh release create "v$version" bin/*.vsix --title "v$version" --notes-file notes.md --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # publishes to open-vsx.org; versions already published are skipped
      - name: Publish to Open VSX
        if: github.ref == 'refs/heads/main'
        run: npx ovsx publish --packagePath bin/*.vsix --pat "$OVSX_PAT" --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
