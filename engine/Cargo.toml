[package]
name = "amaze-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
base64-simd = "0.8.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
